<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Simple Slideshow</title>
		<meta charset="UTF-8"/>
		<meta name="viewport" content="width=device-width, initial-scale=1"/>
		
		<style>
			@keyframes messageFadeOut {
				from {
					opacity: 1;
					visibility: visible;
				}
				to {
					opacity: 0;
					visibility: hidden;
				}
			}
			
			body {
				margin: 0;
				height: 100vh;
				
				display: flex;
				justify-content: center;
				align-items: center;
				
				background: #000;
				font: small sans-serif;
			}
			body.running { cursor: none; }
			
			#systemMessage {
				position: absolute;
				top: 1ex;
				margin: auto;
				font-size: large;
				text-shadow: 0 1px 2px #000;
				animation: 0.4s linear forwards;
				pointer-events: none;
			}
			#slideImage {
				max-width: 100vw;
				max-height: 100vh;
				flex-grow: 1;
				object-fit: contain;
				pointer-events: none;
			}
			
			#designArea {
				position: relative;
				z-index: 2;
				
				box-sizing: border-box;
				width: calc(100% - 10px);
				height: calc(100% - 10px);
				padding: 7px;
				background: Canvas;
				color: CanvasText
				overflow-y: auto;
			}
			body.running #designArea { display: none; }
			
			#designArea input, #designArea textarea, #designArea button {
				font: small sans-serif;
				padding: 1px;
				margin: 0;
			}
			#designArea input, #designArea textarea {
				height: 1em;
				line-height: 0.95em !important;
			}
			
			#imageSlots > div {
				display: flex;
				gap: 1ex;
				margin-top: 0.5ex;
			}
			#designArea #addImageButton {
				display: block;
				margin: 0.5ex 0 2ex;
			}
			#imageSlots button { line-height: 0; }
			textarea.url {
				resize: none;
				width: 25em;
				flex-grow: 5;
				white-space: nowrap;
				overflow: hidden;
			}
			input.weight, #intervalInput { width: 5em; }
			#shuffleHelp { color: GrayText; }
			#designArea #startButton {
				display: block;
				margin: 1em auto;
				font-size: large !important;
			}
			
			h1, h4 {
				text-align: center;
				margin: 0;
			}
		</style>
	</head>
	<body>
		<p id="systemMessage"></p>
		
		<img id="slideImage" style="display: none;"/>
		
		<div id="designArea">
			<h1>Simple Slideshow</h1>
			<h4><i>"Well, I'm glad that it's simple."</i></h4>
			
			<button id="startButton">Start slideshow</button>
			
			<p style="margin: 0.5ex 0;">
				<label for="intervalInput">Interval (seconds):</label> <input id="intervalInput" type="number"/><br/>
				<label for="shuffleCheckbox">Shuffle?:</label> <input id="shuffleCheckbox" type="checkbox"/> <span id="shuffleHelp"></span>
			</p>
			<div id="imageSlots"></div>
			<button id="addImageButton">+ Add image</button>
			<p>When you're finished editing, you can copy the page URL to save it for later or share with others.</p>
			
			<p style="text-align: center">by <a href="https://doubledenial.neocities.org" target="_blank">doubledenial</a><br/>
			(tip: if you paste a newline-separated list of URLs into one of the entry boxes, it will fill the list automatically)</p>
		</div>
		
		<script src="main.min.js"></script>
	</body>
</html>
